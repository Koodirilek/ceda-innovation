# Production-style stack for AWS (or any server): portal + automatic HTTPS (Caddy).
# Start with:  docker compose -f docker-compose.aws.yml up -d --build
services:
  portal:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes: ["./data:/app/data"]
    expose: ["3000"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on: [portal]
volumes:
  caddy_data:
  caddy_config:
